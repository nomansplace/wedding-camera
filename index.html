<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gunjan & Henri's Wedding Camera & Itinerary</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        weddingRed: '#800020',
                        weddingGold: '#D4AF37',
                        weddingCream: '#FDFBF7',
                        weddingDark: '#1A1A1A'
                    }
                }
            }
        }
    </script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .font-serif { font-family: 'Playfair Display', serif; }
        /* Filter Effects */
        .filter-royal { filter: contrast(1.1) saturate(1.2) sepia(0.2); }
        .filter-warm { filter: sepia(0.3) brightness(1.05) contrast(1.05); }
        .filter-vintage { filter: sepia(0.5) contrast(1.2) brightness(0.9); }
        .filter-bw { filter: grayscale(100%) contrast(1.2); }
        .filter-cinematic { filter: contrast(1.3) saturate(0.85) brightness(0.95); }
        .filter-golden { filter: sepia(0.4) saturate(1.4) brightness(1.1); }
        .filter-vibrant { filter: saturate(1.5) contrast(1.1); }
        .filter-soft { filter: brightness(1.1) blur(0.2px) saturate(0.9); }
        .filter-matte { filter: contrast(0.9) brightness(1.05) saturate(0.9); }
        .filter-dramatic { filter: contrast(1.4) brightness(0.9) saturate(1.2); }
    </style>
</head>
<body class="bg-weddingCream text-weddingDark h-full flex flex-col selection:bg-weddingGold selection:text-white">

    <!-- LOGIN SCREEN -->
    <div id="loginScreen" class="fixed inset-0 z-50 bg-weddingDark flex items-center justify-center p-4 bg-opacity-95 backdrop-blur-md">
        <div class="bg-weddingCream rounded-2xl max-w-md w-full p-8 shadow-2xl border-2 border-weddingGold text-center relative overflow-hidden">
            <div class="absolute -top-12 -right-12 w-32 h-32 bg-weddingGold opacity-10 rounded-full pointer-events-none"></div>
            <div class="mb-4 text-weddingRed text-4xl"><i class="fa-solid fa-ring"></i></div>
            <h1 class="font-serif text-3xl font-bold text-weddingRed mb-1">Gunjan & Henri</h1>
            <p class="text-xs uppercase tracking-widest text-weddingGold font-semibold mb-6">October 9–19, 2026 • India & Finland</p>
            
            <div class="space-y-4 text-left">
                <div>
                    <label class="block text-sm font-semibold text-weddingDark mb-1">Your Name / Family Name *</label>
                    <input type="text" id="guestNameInput" placeholder="e.g. Priya Sharma" class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:outline-none focus:border-weddingGold bg-white text-weddingDark">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-weddingDark mb-1">Event Passcode *</label>
                    <input type="password" id="passcodeInput" placeholder="Enter passcode (17102026)" class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:outline-none focus:border-weddingGold bg-white text-weddingDark">
                    <p class="text-xs text-gray-500 mt-1 italic">Passcode: 17102026</p>
                </div>
                <button type="button" onclick="handleLoginSubmit()" class="w-full py-3.5 bg-weddingRed text-weddingGold font-bold rounded-xl shadow-lg hover:bg-opacity-90 transition duration-200 uppercase tracking-wider text-sm">
                    Enter Celebration <i class="fa-solid fa-arrow-right ml-2"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- MAIN APP CONTAINER -->
    <div id="appContainer" class="hidden flex-1 flex flex-col h-full max-w-4xl mx-auto w-full bg-white shadow-xl overflow-hidden relative">
        
        <!-- HEADER -->
        <header class="bg-weddingRed text-weddingGold px-4 py-3 flex items-center justify-between border-b-2 border-weddingGold shadow-md z-20">
            <div class="flex items-center space-x-2">
                <i class="fa-solid fa-camera-retro text-xl"></i>
                <div>
                    <h2 class="font-serif font-bold text-lg leading-tight">Gunjan & Henri</h2>
                    <span id="userBadge" class="text-[10px] tracking-widest uppercase bg-weddingGold text-weddingRed px-2 py-0.5 rounded-full font-bold">Guest</span>
                </div>
            </div>
            <div class="flex items-center space-x-3 text-sm">
                <span id="syncStatus" class="hidden md:inline-block text-xs text-emerald-300"><i class="fa-solid fa-cloud-arrow-up mr-1"></i> Drive Sync Ready</span>
                <button onclick="logout()" title="Switch User" class="text-weddingGold hover:text-white px-2 py-1"><i class="fa-solid fa-right-from-bracket"></i></button>
            </div>
        </header>

        <!-- NAVIGATION TABS -->
        <nav class="bg-weddingCream border-b border-gray-200 flex justify-around py-2 px-1 text-xs sm:text-sm font-semibold text-weddingDark overflow-x-auto z-10 shadow-sm">
            <button onclick="switchTab('camera')" id="nav-camera" class="flex flex-col items-center px-3 py-1.5 rounded-lg text-weddingRed transition"><i class="fa-solid fa-camera text-base mb-0.5"></i> Camera</button>
            <button onclick="switchTab('gallery')" id="nav-gallery" class="flex flex-col items-center px-3 py-1.5 rounded-lg hover:text-weddingRed transition"><i class="fa-solid fa-images text-base mb-0.5"></i> Gallery</button>
            <button onclick="switchTab('slideshow')" id="nav-slideshow" class="flex flex-col items-center px-3 py-1.5 rounded-lg hover:text-weddingRed transition"><i class="fa-solid fa-sliders text-base mb-0.5"></i> Slideshow</button>
            <button onclick="switchTab('itinerary')" id="nav-itinerary" class="flex flex-col items-center px-3 py-1.5 rounded-lg hover:text-weddingRed transition"><i class="fa-solid fa-calendar-days text-base mb-0.5"></i> Itinerary</button>
            <button onclick="switchTab('guestbook')" id="nav-guestbook" class="flex flex-col items-center px-3 py-1.5 rounded-lg hover:text-weddingRed transition"><i class="fa-solid fa-book-open text-base mb-0.5"></i> Guestbook</button>
            <button onclick="switchTab('admin')" id="nav-admin" class="hidden flex flex-col items-center px-3 py-1.5 rounded-lg hover:text-weddingRed transition"><i class="fa-solid fa-shield-halved text-base mb-0.5"></i> Admin</button>
        </nav>

        <!-- CONTENT AREA -->
        <main class="flex-1 overflow-y-auto relative bg-weddingCream p-4">

            <!-- TAB 1: CAMERA & VIDEO -->
            <section id="tab-camera" class="space-y-4 max-w-lg mx-auto pb-10">
                <div class="bg-white p-3 rounded-xl shadow-sm border border-gray-200">
                    <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Select Event Date:</label>
                    <select id="eventSelector" class="w-full p-2.5 rounded-lg border border-gray-300 font-semibold text-weddingDark bg-weddingCream focus:outline-none focus:border-weddingGold">
                        <option value="Welcome Dinner (Oct 9)">Welcome Dinner (Oct 9)</option>
                        <option value="Shopping & Mehndi Night (Oct 10)">Shopping & Mehndi Night (Oct 10)</option>
                        <option value="Sagai & Ring Ceremony (Oct 11)">Sagai & Ring Ceremony (Oct 11)</option>
                        <option value="Haldi Ceremony (Oct 12)">Haldi Ceremony (Oct 12)</option>
                        <option value="Sangeet Night (Oct 13)">Sangeet Night (Oct 13)</option>
                        <option value="Hindu Wedding & Pheras (Oct 14)" selected>Hindu Wedding & Pheras (Oct 14)</option>
                        <option value="Grand Reception (Oct 15)">Grand Reception (Oct 15)</option>
                        <option value="Family Farewell (Oct 16)">Family Farewell (Oct 16)</option>
                        <option value="Christian Wedding Ceremony (Oct 17)">Christian Wedding Ceremony (Oct 17)</option>
                        <option value="Celebration & Pre-Departure (Oct 18)">Celebration & Pre-Departure (Oct 18)</option>
                        <option value="Finland Celebration (Oct 19)">Finland Celebration (Oct 19)</option>
                    </select>
                </div>

                <!-- Camera Preview -->
                <div class="relative bg-black rounded-2xl overflow-hidden shadow-lg aspect-[3/4] flex items-center justify-center">
                    <video id="videoElement" autoplay playsinline class="w-full h-full object-cover"></video>
                    <canvas id="canvasElement" class="hidden"></canvas>
                    <img id="imagePreview" class="hidden w-full h-full object-contain bg-black" alt="Captured Photo">
                    
                    <div class="absolute bottom-3 left-3 right-3 bg-black/50 backdrop-blur-sm text-white p-2.5 rounded-xl text-xs flex justify-between items-center pointer-events-none border border-white/20">
                        <div>
                            <p id="watermarkGuest" class="font-bold text-weddingGold">Guest: --</p>
                            <p id="watermarkHashtag" class="text-[10px] text-gray-300">#FenryWithHisGun • Gunjan & Henri</p>
                        </div>
                    </div>
                </div>

                <!-- Upload Button -->
                <div class="flex items-center justify-center space-x-2">
                    <label class="cursor-pointer bg-white border border-gray-300 px-4 py-2 rounded-xl text-xs font-semibold hover:bg-gray-50 shadow-sm flex items-center">
                        <i class="fa-solid fa-upload mr-2 text-weddingRed"></i> Upload Photos / Videos
                        <input type="file" accept="image/*,video/*" multiple onchange="handleFileUpload(event)" class="hidden">
                    </label>
                </div>

                <!-- Controls -->
                <div id="captureControls" class="grid grid-cols-2 gap-3">
                    <button onclick="capturePhoto()" class="py-3.5 bg-weddingRed text-weddingGold font-bold rounded-xl shadow-lg hover:bg-opacity-90 flex items-center justify-center text-sm tracking-wide">
                        <i class="fa-solid fa-camera mr-2 text-lg"></i> Snap Photo
                    </button>
                    <button onclick="alert('Camera snap active!')" class="py-3.5 bg-weddingGold text-weddingRed font-bold rounded-xl shadow-lg flex items-center justify-center text-sm tracking-wide">
                        <i class="fa-solid fa-video mr-2 text-lg"></i> Video
                    </button>
                </div>
            </section>

            <!-- TAB 2: GALLERY -->
            <section id="tab-gallery" class="hidden space-y-4 pb-10">
                <div class="flex justify-between items-center bg-white p-3 rounded-xl shadow-sm border border-gray-200">
                    <span id="photoCountBadge" class="text-xs font-bold text-weddingRed">0 Media Items</span>
                </div>
                <div id="galleryGrid" class="grid grid-cols-2 sm:grid-cols-3 gap-3"></div>
            </section>

            <!-- TAB 3: SLIDESHOW -->
            <section id="tab-slideshow" class="hidden space-y-4 text-center pb-10">
                <div class="bg-black rounded-2xl overflow-hidden shadow-xl relative aspect-[4/3] flex items-center justify-center">
                    <img id="slideshowImage" src="https://images.unsplash.com/photo-1583939003579-730e3918a45a?auto=format&fit=crop&w=800&q=80" class="w-full h-full object-contain">
                </div>
            </section>

            <!-- TAB 4: ITINERARY -->
            <section id="tab-itinerary" class="hidden space-y-4 pb-10 max-w-lg mx-auto">
                <div id="itineraryList" class="space-y-3"></div>
            </section>

            <!-- TAB 5: GUESTBOOK -->
            <section id="tab-guestbook" class="hidden space-y-4 pb-10 max-w-lg mx-auto">
                <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200">
                    <h3 class="font-serif text-lg font-bold text-weddingRed mb-2">Leave a Wish for Gunjan & Henri</h3>
                    <textarea id="guestbookMessage" rows="3" placeholder="Write your wishes here..." class="w-full p-3 rounded-xl border border-gray-300 text-sm focus:outline-none focus:border-weddingGold bg-weddingCream mb-2"></textarea>
                    <button onclick="submitWish()" class="w-full py-2.5 bg-weddingRed text-weddingGold font-bold rounded-xl text-sm shadow">Post Wish</button>
                </div>
                <div id="guestbookList" class="space-y-3"></div>
            </section>

            <!-- TAB 6: ADMIN PANEL -->
            <section id="tab-admin" class="hidden space-y-4 pb-10 max-w-lg mx-auto">
                <div class="bg-white p-4 rounded-xl shadow-sm border border-weddingGold text-center">
                    <h3 class="font-serif text-xl font-bold text-weddingRed mb-2">Host Admin Panel</h3>
                    <p class="text-xs text-gray-500">Welcome Gunjan & Henri!</p>
                </div>
            </section>

        </main>
    </div>

    <!-- SCRIPT -->
    <script>
        const PASSCODE = "17102026";
        let currentUser = { name: "", role: "Guest" };
        let mediaStream = null;
        let photos = JSON.parse(localStorage.getItem("wedding_photos") || "[]");

        function handleLoginSubmit() {
            const name = document.getElementById("guestNameInput").value.trim();
            const passcode = document.getElementById("passcodeInput").value.trim();

            if (!name) {
                alert("Please enter your name!");
                return;
            }
            if (passcode !== PASSCODE) {
                alert("Incorrect passcode! Correct passcode is 17102026");
                return;
            }

            currentUser.name = name;
            const lower = name.toLowerCase();
            if (lower === "gunjan" || lower === "henri") {
                currentUser.role = "Host / Admin";
                document.getElementById("nav-admin").classList.remove("hidden");
            }

            document.getElementById("loginScreen").classList.add("hidden");
            document.getElementById("appContainer").classList.remove("hidden");
            document.getElementById("watermarkGuest").innerText = `Guest: ${currentUser.name}`;

            initCamera();
            renderGallery();
            renderItinerary();
        }

        function logout() {
            location.reload();
        }

        function switchTab(tabId) {
            ['camera', 'gallery', 'slideshow', 'itinerary', 'guestbook', 'admin'].forEach(t => {
                document.getElementById(`tab-${t}`).classList.add("hidden");
            });
            document.getElementById(`tab-${tabId}`).classList.remove("hidden");
        }

        async function initCamera() {
            try {
                mediaStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
                document.getElementById("videoElement").srcObject = mediaStream;
            } catch(e) {
                console.log("Camera access error:", e);
            }
        }

        function capturePhoto() {
            const video = document.getElementById("videoElement");
            const canvas = document.getElementById("canvasElement");
            canvas.width = video.videoWidth || 640;
            canvas.height = video.videoHeight || 480;
            const ctx = canvas.getContext("2d");
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            const url = canvas.toDataURL("image/jpeg", 0.8);
            photos.unshift({ name: currentUser.name, url: url });
            localStorage.setItem("wedding_photos", JSON.stringify(photos));
            alert("Photo captured and saved!");
            renderGallery();
            switchTab("gallery");
        }

        function handleFileUpload(e) {
            const files = e.target.files;
            if(!files || files.length === 0) return;
            Array.from(files).forEach(file => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onloadend = function() {
                    photos.unshift({ name: currentUser.name, url: reader.result });
                    localStorage.setItem("wedding_photos", JSON.stringify(photos));
                    renderGallery();
                };
            });
            alert("Uploaded successfully!");
            switchTab("gallery");
        }

        function renderGallery() {
            const grid = document.getElementById("galleryGrid");
            grid.innerHTML = "";
            document.getElementById("photoCountBadge").innerText = `${photos.length} Media Items`;
            photos.forEach(p => {
                const div = document.createElement("div");
                div.className = "bg-black rounded-lg overflow-hidden aspect-[3/4]";
                div.innerHTML = `<img src="${p.url}" class="w-full h-full object-cover">`;
                grid.appendChild(div);
            });
        }

        function renderItinerary() {
            const list = document.getElementById("itineraryList");
            list.innerHTML = `
                <div class="bg-white p-3 rounded-lg border"><strong>Oct 9:</strong> Welcome Dinner</div>
                <div class="bg-white p-3 rounded-lg border"><strong>Oct 10:</strong> Shopping & Mehndi Night</div>
                <div class="bg-white p-3 rounded-lg border"><strong>Oct 11:</strong> Sagai & Ring Ceremony</div>
                <div class="bg-white p-3 rounded-lg border"><strong>Oct 12:</strong> Haldi Ceremony</div>
                <div class="bg-white p-3 rounded-lg border"><strong>Oct 13:</strong> Sangeet Night</div>
                <div class="bg-white p-3 rounded-lg border"><strong>Oct 14:</strong> Hindu Wedding & Pheras</div>
                <div class="bg-white p-3 rounded-lg border"><strong>Oct 15:</strong> Grand Reception</div>
                <div class="bg-white p-3 rounded-lg border"><strong>Oct 16:</strong> Family Farewell</div>
                <div class="bg-white p-3 rounded-lg border"><strong>Oct 17:</strong> Christian Wedding Ceremony</div>
                <div class="bg-white p-3 rounded-lg border"><strong>Oct 18:</strong> Celebration & Pre-Departure</div>
                <div class="bg-white p-3 rounded-lg border"><strong>Oct 19:</strong> Finland Celebration</div>
            `;
        }

        function submitWish() {
            const msg = document.getElementById("guestbookMessage").value;
            if(!msg) return;
            alert("Wish posted!");
            document.getElementById("guestbookMessage").value = "";
        }
    </script>
</body>
</html>
